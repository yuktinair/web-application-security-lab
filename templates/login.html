
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ "Register" if mode == "register" else "Login" }}</title>
</head>
<body>
    <h1>{{ "Create an Account" if mode == "register" else "Login" }}</h1>

    {% if message %}
        <p role="alert">{{ message }}</p>
    {% endif %}

    <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text"
               maxlength="50" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               minlength="12"
               autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"
               required>

        <button type="submit">
            {{ "Register" if mode == "register" else "Login" }}
        </button>
    </form>

    {% if mode == "register" %}
        <p>Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    {% else %}
        <p>New here? <a href="{{ url_for('register') }}">Register</a></p>
    {% endif %}

    <p><a href="{{ url_for('home') }}">Home</a></p>
</body>
</html>`
